<style>

#fab{position:fixed;z-index:25;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}
#fab:active{transform:scale(.94)}

@media(min-width:900px){html[data-mode=side] nav button{justify-content:flex-start}html[data-mode=side] .lbl{display:inline}html[data-mode=side] .navpost{justify-content:center}html[data-mode=side] nav .brand{display:block;font-weight:800;font-size:20px;color:var(--ac);padding:8px 14px 12px}}

.mopt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:none;color:var(--tx);padding:12px;border-radius:12px;font:inherit;cursor:pointer}
.mopt:hover{background:var(--card)}.mopt b{display:block}.mopt .sub{color:var(--mut);font-size:13px}

.shd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.shd h2{margin:0;flex:1;font-size:17px}.shd .b{margin:0}.shd .x{margin:0;color:var(--tx);display:flex}
.sbody{padding:4px 14px calc(24px + env(safe-area-inset-bottom))}

.row{display:flex;gap:8px}.row>*{flex:1}

button.b.g{background:var(--line);color:var(--tx)}button.b.r{background:#d33}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:8px;border:1px solid var(--line);background:none;color:var(--tx);border-radius:20px;font:inherit;cursor:pointer}

img[data-blob]:not([src]){background:var(--card);min-height:80px}
.miss{display:flex;align-items:center;justify-content:center;min-height:120px;background:var(--card);color:var(--mut);font-size:13px;text-align:center;padding:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.th{position:relative;width:76px;height:76px}.th img{width:100%;height:100%;object-fit:cover;border-radius:8px;display:block}
.th .x{position:absolute;top:-6px;right:-6px;margin:0;width:22px;height:22px;border-radius:50%;background:#222;color:#fff;font-size:12px;line-height:1;padding:0}
.gwrap{position:relative}.gcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gcar::-webkit-scrollbar{display:none}.gcar>*{flex:none;width:100%;scroll-snap-align:start}
.gbadge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:12px;pointer-events:none}

.gram .ft{padding:10px}.gram .ft .acts{margin:0 0 6px;font-size:20px}
.plist{display:flex;gap:10px;align-items:center}.plist .pmain{flex:1;min-width:0;overflow-wrap:anywhere}.plist .b{margin:0;flex:none}
/* Bio preview in the list: keeps the formatting but flows as a short, 2-line clamped snippet. */
.pbio{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.pbio .bio-md,.pbio p,.pbio ul,.pbio ol,.pbio li{display:inline;margin:0;padding:0;list-style:none}
.pbio p::after{content:' '}.pbio li::after{content:' \00b7 '}.pbio br{display:none}.pbio a{pointer-events:none}
#toast{position:fixed;z-index:60;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
.lk{cursor:pointer}
.ab{display:flex;gap:6px;align-items:center;border:0;background:none;color:var(--mut);padding:4px 0;cursor:pointer;font:inherit;font-size:13px}
.ab.rp.on{color:#00ba7c}.ab.li.on{color:#f91880}
/* Chirp uses compact, restrained outline actions; Gram uses its familiar bold icon row. */
.chirp .ab svg{stroke-width:1.8}.chirp .ab{min-width:42px;transition:color .15s,transform .15s}.chirp .ab:active,.gb:active{transform:scale(.92)}
.gram .gb svg{stroke-width:2.25}.gram .gb[data-act="like"] svg{stroke-width:2.1}.gram .gb[data-act="like"].on{color:#ed4956}
.bio-md{overflow-wrap:anywhere}.bio-md p{margin:0 0 6px}.bio-md p:last-child{margin-bottom:0}.bio-md a{color:var(--ac);text-decoration:underline}.bio-md ul,.bio-md ol{margin:4px 0;padding-left:22px}.bio-md code{background:var(--line);border-radius:4px;padding:1px 4px;font-size:.9em}
.chirp .acts{justify-content:space-between;gap:0;max-width:400px;margin-top:4px}
.gacts{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.gb{border:0;background:none;color:var(--tx);padding:0;cursor:pointer;display:flex}.gb.on{color:#ed4956}
.gring{padding:2px;border-radius:50%;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);display:flex}.gring .av{border:2px solid var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px}
.chips button{flex:none;padding:6px 12px;border:1px solid var(--line);background:none;color:var(--tx);border-radius:20px;font:inherit;font-size:13px;cursor:pointer}.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pbtn{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;background:var(--bg)}
.pick{border:1px solid var(--line);border-radius:8px;margin-top:6px;padding:6px 8px;max-height:320px;overflow:auto;background:var(--bg)}
.prow2{display:flex;gap:10px;align-items:center;padding:8px 4px;border-radius:8px;cursor:pointer}.selectbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}.selectbar button{margin:0}.selectbox{width:20px;height:20px;flex:none}.reroll{font-size:12px!important;min-width:0!important;color:var(--ac)}.prow2.sel{background:var(--card)}
.bfail{display:flex;height:100%;align-items:flex-end;padding:8px 12px;color:rgba(255,255,255,.8);font-size:12px}
.pbanner{height:130px;border-radius:12px 12px 0 0;overflow:hidden}.pbanner img{width:100%;height:100%;object-fit:cover}
.prow{display:flex;justify-content:space-between;align-items:flex-end;margin-top:-42px;padding:0 4px}.pav .av{border:4px solid var(--bg)}
.pinfo{padding:0 4px 8px}
.ptabs{display:flex;border-bottom:1px solid var(--line)}.ptabs button{flex:1;padding:12px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mut);font:inherit;cursor:pointer}.ptabs button.on{color:var(--tx);font-weight:700;border-color:var(--ac)}
.pg-top{display:flex;gap:20px;align-items:center}.pg-st{display:flex;flex:1;justify-content:space-around;text-align:center}.pg-st b{display:block;font-size:18px}.pg-st span{font-size:13px;color:var(--mut)}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:12px}.ggrid>*{aspect-ratio:1;width:100%;object-fit:cover}
.gt{display:flex;align-items:center;justify-content:center;padding:6px;color:#fff;font-size:11px;text-align:center;overflow:hidden}
.cap{white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body>
<div id="main"></div>
<nav aria-label="Main">
<div class="brand">MockFeed</div>
<button data-act="tab" data-v="feed" data-i="home"><span class="lbl">Home</span></button>
<button data-act="tab" data-v="profiles" data-i="users"><span class="lbl">Profiles</span></button>
<button data-act="tab" data-v="data" data-i="archive"><span class="lbl">Backup</span></button>
<button data-act="tab" data-v="settings" data-i="sliders"><span class="lbl">Settings</span></button>
<button class="navpost" data-act="newpost" data-i="plus"><span class="lbl" id="navpostlbl">Post</span></button>
</nav>
<button id="fab" data-act="newpost" aria-label="New post"></button>
<div id="mback" hidden data-act="closemenu"><div id="pmenu" role="menu" data-act="noop"></div></div>
<dialog id="sheet" aria-label="New post"></dialog>
<div id="toast" role="status"></div>
<script>
const KEY='mockfeed-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const col=(c,d)=>/^#[0-9a-f]{3,8}$/i.test(c||'')?c:(d||'#888');
const first=s=>{s=String(s||'?');try{return[...new Intl.Segmenter().segment(s)][0].segment}catch(e){return[...s][0]||'?'}};
const SCHEMA=2;
const fmt=n=>{n=+n||0;return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n)};
let S=load(),view='feed',editing=null,draft={},author='',pickOpen=false,viewing=null,prev='feed',ptab='posts',selectedProfiles=new Set(),composeKind=null,menuOpen=false;
/* Per-device look-and-feel prefs. Kept out of S on purpose so backups don't carry layout choices between devices. */
const UIKEY='mockfeed-ui';
let UI=(()=>{let u={};try{u=JSON.parse(localStorage.getItem(UIKEY))||{}}catch(e){}return{nav:['auto','bottom','side'].includes(u.nav)?u.nav:'auto',scheme:['auto','light','dark'].includes(u.scheme)?u.scheme:'auto'}})();
const saveUI=()=>{try{localStorage.setItem(UIKEY,JSON.stringify(UI))}catch(e){}};
const wide=matchMedia('(min-width:900px)');
function applyUI(){const r=document.documentElement;r.dataset.mode=UI.nav==='side'||(UI.nav==='auto'&&wide.matches)?'side':'bottom';r.dataset.scheme=UI.scheme}
if(wide.addEventListener)wide.addEventListener('change',applyUI);else if(wide.addListener)wide.addListener(applyUI);
applyUI();
const KINDS={chirp:[{k:'text',i:'text',t:'Text post',s:'Say something'},{k:'photo',i:'photo',t:'Photo post',s:'Share up to 4 photos'}],gram:[{k:'photo',i:'photo',t:'Post',s:'Share photos'},{k:'text',i:'text',t:'Note',s:'A short text-only post'}]};
function migrate(d){
  if(!Array.isArray(d.posts))d.posts=[];
  d.posts=d.posts.filter(p=>p&&typeof p==='object'&&p.id);
  for(const p of d.posts){
    if(!Array.isArray(p.media)){p.media=safeUrl(p.img)?[{type:'image',url:p.img}]:[]}
    delete p.img;
  }
  d.profiles=(d.profiles||[]).filter(p=>p&&typeof p==='object'&&p.id);
  d.theme=d.theme==='gram'?'gram':'chirp';
  d.v=SCHEMA;return d}
function load(){try{
  const raw=localStorage.getItem(KEY),d=JSON.parse(raw);
  if(d&&Array.isArray(d.profiles)){
    if((d.v||1)<SCHEMA){try{localStorage.setItem(KEY+'-pre-v'+SCHEMA,raw)}catch(e){}}
    return migrate(d)}
}catch(e){}return{v:SCHEMA,profiles:[],posts:[],theme:'chirp'}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save (storage full or blocked)')}}
function placeToast(){const e=$('#toast'),sh=$('#sheet'),h=sh.open?sh:document.body;if(e.parentNode!==h)h.appendChild(e)}
function toast(t){placeToast();const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3000)}
const P=id=>S.profiles.find(p=>p.id===id);
const replyCount=id=>S.posts.filter(p=>p.replyTo===id).length;
const memberPoolSize=()=>S.profiles.filter(p=>p.pkId).length||S.profiles.length;
const randomEngagement=()=>Math.floor(Math.random()*(memberPoolSize()+1));
function ago(t){const m=Math.max(0,(Date.now()-t)/6e4);if(m<1)return'now';if(m<60)return Math.floor(m)+'m';if(m<1440)return Math.floor(m/60)+'h';if(m<10080)return Math.floor(m/1440)+'d';return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function av(p,s){const u=safeUrl(p.avatar),i=esc(first(p.name).toUpperCase());return `<div class="av" style="width:${s}px;height:${s}px;background:${col(p.color)};font-size:${s/2.3}px">${u?`<img src="${esc(u)}" alt="" referrerpolicy="no-referrer" data-fb="av" data-i="${i}">`:i}</div>`}
const unk={name:'Unknown',handle:'unknown',color:'#888'};
const okBlob=m=>typeof m.blob==='string'&&/^[a-z0-9]+$/i.test(m.blob);
const mediaOf=p=>(Array.isArray(p.media)?p.media:[]).filter(m=>m&&(m.type==='image'||m.type==='gif')&&(safeUrl(m.url)||okBlob(m)));
const ratio=m=>+m.w>0&&+m.h>0?`style="aspect-ratio:${+m.w}/${+m.h}"`:'';
// One <img> builder for both remote links and photos stored on this device (filled in by hydrate()).
const mimg=(m,cls,fb,extra)=>{const a=`${cls?`class="${cls}" `:''}alt="" data-fb="${fb}" ${extra||''}`;return okBlob(m)?`<img ${a} data-blob="${esc(m.blob)}">`:`<img ${a} referrerpolicy="no-referrer" src="${esc(m.url)}">`};

/* ---------- photo storage (IndexedDB) ---------- */
const URLS=new Map();
let _db;const idb=()=>_db||(_db=new Promise((res,rej)=>{try{const r=indexedDB.open('mockfeed-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('blobs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>{_db=null;rej(r.error)};r.onblocked=()=>rej(new Error('blocked'))}catch(e){_db=null;rej(e)}}));
async function idbRun(mode,fn){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('blobs',mode),st=t.objectStore('blobs'),out=fn(st);t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('aborted'))})}
const blobPut=rec=>idbRun('readwrite',st=>{st.put(rec)});
const blobDel=ids=>ids.length?idbRun('readwrite',st=>{ids.forEach(i=>st.delete(i))}):Promise.resolve();
const blobClear=()=>idbRun('readwrite',st=>{st.clear()});
async function blobGetMany(ids){const reqs=await idbRun('readonly',st=>ids.map(i=>st.get(i)));return reqs.map(r=>r.result).filter(Boolean)}
async function blobKeys(){const r=await idbRun('readonly',st=>st.getAllKeys());return r.result}
async function blobStats(){let n=0,bytes=0;await idbRun('readonly',st=>{st.openCursor().onsuccess=e=>{const c=e.target.result;if(c){n++;bytes+=(c.value.blob&&c.value.blob.size)||0;c.continue()}}});return{n,bytes}}
function dropUrl(id){const u=URLS.get(id);if(u)URL.revokeObjectURL(u);URLS.delete(id)}
async function gcBlobs(){try{const used=new Set();S.posts.forEach(p=>(p.media||[]).forEach(m=>m&&m.blob&&used.add(m.blob)));
  const dead=(await blobKeys()).filter(k=>!used.has(k));if(dead.length){await blobDel(dead);dead.forEach(dropUrl)}}catch(e){}}
async function hydrate(){
  const els=[...document.querySelectorAll('#main img[data-blob]')];if(!els.length)return;
  const need=[...new Set(els.map(e=>e.dataset.blob).filter(i=>!URLS.has(i)))];
  if(need.length){try{const got=await blobGetMany(need);const have=new Set();got.forEach(r=>{have.add(r.id);URLS.set(r.id,URL.createObjectURL(r.blob))});need.forEach(i=>{if(!have.has(i))URLS.set(i,'')})}catch(e){need.forEach(i=>URLS.set(i,''))}}
  els.forEach(e=>{if(!e.isConnected)return;const u=URLS.get(e.dataset.blob);if(u)e.src=u;else imgFail(e)})}
function imgFail(t){const m=t.dataset.fb;

const val=id=>$('#'+id).value.trim();
const mkHandle=n=>(n||'').toLowerCase().replace(/[^a-z0-9_]/g,'')||'member'+uid().slice(0,3);

function mergeMembers(arr,opt){
  let add=0,upd=0,withBan=0;
  for(const m of arr){
    const pk=m.uuid||m.id; if(!pk)continue;
    const banner=m.banner||m.banner_url||m.bannerUrl||m.profile_banner_url||'';
    const f={name:m.display_name||m.name||'Unnamed',bio:m.description||'',avatar:m.avatar_url||'',color:m.color?'#'+String(m.color).replace('#',''):'#6d5dfc',pronouns:m.pronouns||''};
    if(banner){f.banner=banner;withBan++}
    const ex=S.profiles.find(p=>p.pkId===pk);
    if(ex){Object.assign(ex,f);upd++}else{S.profiles.push({id:uid(),pkId:pk,handle:mkHandle(m.name),followers:Math.floor(Math.random()*900)+50,following:Math.floor(Math.random()*300)+20,created:Date.now(),banner:'',...f});add++}
  }
  save();
  const bn=withBan?` · ${withBan} banner${withBan>1?'s':''} found`:(opt&&opt.authed===false?' · no banners came back (private banners need your token or a pk;export file)':' · no banners found');
  return`Added ${add}, updated ${upd}${bn}`;
}
async function pkFetch(){
  const t=val('pk-token'),r=val('pk-ref');
  if(!t&&!r)return toast('Enter a token or a system ID');
  try{
    const res=await fetch(`https://api.pluralkit.me/v2/systems/${t?'@me':encodeURIComponent(r)}/members`,{headers:t?{Authorization:t}:{}});
    if(!res.ok)throw new Error(res.status===401?'Token not accepted':res.status===404?'System not found, or its member list is private':'Error '+res.status);
    const msg=mergeMembers(await res.json(),{authed:!!t});
    $('#pk-token').value='';toast(msg);render();
  }catch(e){toast('Import failed: '+e.message)}
}
async function doPost(){
  if(draft.busy)return toast('Still processing photos…');
  const text=val('c-tx'),urls=val('c-img').split(/\s+/).filter(Boolean),links=urls.filter(safeUrl).map(url=>({type:'image',url})),pend=draft.pending||[];
  const li=$('#c-li').value.trim(),rp=$('#c-rp').value.trim(),rt=$('#c-rt').value||'';
  if(urls.length&&!links.length&&!pend.length)return toast('Image links must start with http:// or https://');
  if(composeKind==='photo'&&!links.length&&!pend.length)return toast('Add a photo first');
  if(!text&&!links.length&&!pend.length)return toast('Write something first');
  if(pend.length+links.length>4)return toast('Up to 4 images per post. Remove some first');
  const made=[];
  try{for(const f of pend){const id=uid()+uid();await blobPut({id,blob:f.blob,mime:f.mime,created:Date.now()});made.push({id,f})}}
  catch(e){blobDel(made.map(x=>x.id)).catch(()=>{});return toast('Could not store photos (storage full or unavailable here)')}
  made.forEach(({id,f})=>URLS.set(id,f.url));
  const media=[...made.map(({id,f})=>({type:f.mime==='image/gif'?'gif':'image',blob:id,w:f.w,h:f.h,mime:f.mime})),...links];
  S.posts.push({id:uid(),author,text,media,likes:li===''?randomEngagement():Math.max(0,+li||0),reposts:rp===''?randomEngagement():Math.max(0,+rp||0),comments:0,time:(draft.tm&&new Date(draft.tm).getTime())||Date.now(),replyTo:rt});
  save();view='feed';draft={};composeKind=null;pickOpen=false;render();scrollTo(0,0)}
async function importFile(f){
  try{
    let d,z=null;
    if(/\.zip$/i.test(f.name)||f.type==='application/zip'){z=await unzipStore(f);const dj=z.get('data.json');if(!dj)return toast('Unrecognized backup');d=JSON.parse(await dj.text())}
    else d=JSON.parse(await f.text());
    if(Array.isArray(d.profiles)&&Array.isArray(d.posts)){
      if(!confirm('Replace all current data with this backup?'))return;
      let n=0;
      if(z){const meta=d.blobs||{},OK=/^image\/(jpeg|png|webp|gif)$/;
        for(const [name,blob] of z){if(!name.startsWith('media/'))continue;const id=name.slice(6);if(!/^[a-z0-9]+$/i.test(id))continue;
          const mime=OK.test((meta[id]||{}).mime)?meta[id].mime:'image/jpeg';
          await blobPut({id,blob:blob.slice(0,blob.size,mime),mime,created:Date.now()});dropUrl(id);n++}}
      S=migrate({profiles:d.profiles,posts:d.posts,theme:d.theme,sort:d.sort,v:d.v});save();gcBlobs();toast('Backup restored'+(n?` (${n} photo${n>1?'s':''})`:''));
    }else if(Array.isArray(d.members)){toast(mergeMembers(d.members,{authed:true}))}
    else return toast('Unrecognized file');
    render();
  }catch(e){toast('Could not read that file')}
}
async function saveFile(file){
  try{if(matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:file.name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
async function exportData(withMedia){
  try{
    const date=new Date().toISOString().slice(0,10),ids=new Set();
    S.posts.forEach(p=>(p.media||[]).forEach(m=>m&&m.blob&&ids.add(m.blob)));
    let file,note='';
    if(withMedia&&ids.size){
      const files=[],meta={};
      for(const r of await blobGetMany([...ids])){files.push({name:'media/'+r.id,blob:r.blob});meta[r.id]={mime:r.mime||r.blob.type}}
      files.unshift({name:'data.json',blob:new Blob([JSON.stringify({...S,blobs:meta},null,1)],{type:'application/json'})});
      file=new File([await zipStore(files)],`mockfeed-backup-${date}.zip`,{type:'application/zip'});note=` (${files.length-1} photos included)`}
    else{
      const d=JSON.parse(JSON.stringify(S));d.posts.forEach(p=>{p.media=(p.media||[]).filter(m=>m&&!m.blob)});
      file=new File([JSON.stringify(d,null,1)],`mockfeed-backup-${date}.json`,{type:'application/json'});if(ids.size)note=' (photos not included)'}
    await saveFile(file);toast('Backup exported'+note)
  }catch(e){toast('Export failed: '+(e.message||e))}
}
const mb=n=>(n/1048576).toFixed(n<1048576*10?1:0)+' MB';
async function showUsage(){
  const el=$('#usage');if(!el)return;
  try{const st=await blobStats(),est=navigator.storage&&navigator.storage.estimate?await navigator.storage.estimate():null,per=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():null;
    if(!$('#usage'))return;
    $('#usage').textContent=`Photos: ${st.n} (${mb(st.bytes)})`+(est&&est.quota?` · Browser storage: ${mb(est.usage||0)} used of about ${mb(est.quota)}`:'')+(per===null?'':` · Persistent storage: ${per?'yes':'not granted'}`)}
  catch(e){el.textContent='Photo storage unavailable in this browser mode.'}}
function deleteProfiles(ids){
  const targets=S.profiles.filter(p=>ids.includes(p.id));if(!targets.length)return;
  if(!confirm(`Delete ${targets.length} profile${targets.length===1?'':'s'}?`))return;
  const postCount=S.posts.filter(p=>ids.includes(p.author)).length;
  const deletePosts=postCount?confirm(`These profiles authored ${postCount} post(s). Delete those posts too?\n\nOK = delete their posts\nCancel = preserve posts with a deleted/unknown author`):false;
  S.profiles=S.profiles.filter(p=>!ids.includes(p.id));
  if(deletePosts)S.posts=S.posts.filter(p=>!ids.includes(p.author));
  selectedProfiles.clear();if(editing&&ids.includes(editing))editing=null;
  save();gcBlobs();toast(deletePosts?'Profiles and authored posts deleted':'Profiles deleted; authored posts preserved');
}

  else if(a==='replyto'){draft.rt=id;composeKind=composeKind||'text'}

  const KEEP=['like','repost','sort','pick','choose','ptab','delpost','selectprofile','selectall','clearselect','reroll','rmpending','discard','setnav','setscheme'],y=scrollY;render(KEEP.includes(a));scrollTo(0,KEEP.includes(a)?y:0);

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){menuOpen=false;render(true)}});
document.addEventListener('close',e=>{if(e.target.id==='sheet'&&composeKind){composeKind=null;pickOpen=false;render(true)}},true);
document.addEventListener('toggle',e=>{if(e.target.matches&&e.target.matches('details[data-opt]'))draft.opt=e.target.open},true);
document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement)imgFail(e.target)},true);
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.d;if(k)draft[k]=e.target.value});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-file]')&&t.files[0]){importFile(t.files[0]);t.value=''}else if(t.matches('[data-photo]')&&t.files.length){addPhotos([...t.files]);t.value=''}});

document.querySelectorAll('nav button[data-i]').forEach(b=>b.insertAdjacentHTML('afterbegin',ic(b.dataset.i,22)));
$('#fab').innerHTML=ic('plus',28);
render();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script></body></html>
